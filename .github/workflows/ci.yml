name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

# Unit tests ONLY. No assemble tasks, no APK is built or uploaded anywhere.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Run unit tests
        run: ./gradlew test --stacktrace
