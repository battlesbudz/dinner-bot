name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build the release for (e.g. v0.1.0)"
        required: true

# Builds the signed release APK from repository secrets and publishes it as a
# GitHub Release. Secrets: KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS,
# KEY_PASSWORD. The keystore itself never enters the repository.
#
# Commercial-branch guard: GitHub Actions tag triggers cannot be filtered
# by branch, so a v* tag pointing at a commit that is only on the
# commercial branch would otherwise run this workflow. The guard job
# below checks that the commit being released is an ancestor of main
# and the release job only runs when that check passes. For a release
# from main (the only supported case) the guard passes and the release
# job below runs exactly as before. A tag or dispatch whose target
# commit is not on main is skipped and publishes nothing. The
# commercial version is distributed through Google Play only and must
# never publish a GitHub Release APK.
jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      allow: ${{ steps.check.outputs.allow }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - name: Verify the release commit is on main
        id: check
        run: |
          git fetch origin main:refs/remotes/origin/main
          TARGET_SHA="$(git rev-parse HEAD)"
          echo "Release target commit: $TARGET_SHA"
          if git merge-base --is-ancestor "$TARGET_SHA" origin/main; then
            echo "Target commit is on main; release may proceed."
            echo "allow=true" >> "$GITHUB_OUTPUT"
          else
            echo "Target commit is NOT on main; skipping release. Releases are published from main only."
            echo "allow=false" >> "$GITHUB_OUTPUT"
          fi
  release:
    needs: guard
    if: needs.guard.outputs.allow == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/dinnerbot.jks"
      - name: Build signed release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/dinnerbot.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace
      - name: Publish GitHub Release with the APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: Dinner Bot ${{ inputs.tag || github.ref_name }} - first usable release
          files: app/build/outputs/apk/release/*.apk
          body: |
            Dinner Bot's first usable release: week planner under a weekly cash
            cap, three-store grocery list, Sam's Club bulk stock tracking with
            the $15/month savings gate, price book corrections, pantry
            checklist, and JSON backup export/import. Fully offline; no
            account, no ads, no tracking.
